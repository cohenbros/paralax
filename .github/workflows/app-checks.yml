# בדיקות לאפליקציה בכל push: טיפוסים, lint (כולל כללי השכבות), בדיקות, ובדיקת חוזה מול הנתונים שפורסמו
name: app-checks

on:
  push:
    paths: ["app/**", ".github/workflows/app-checks.yml"]
  pull_request:
    paths: ["app/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Download published data for the contract test
        working-directory: .
        run: |
          mkdir -p site/data
          curl -fsS https://cohenbros.github.io/paralax/data/latest.json -o site/data/latest.json
          curl -fsS https://cohenbros.github.io/paralax/data/sources.json -o site/data/sources.json
      - run: npm run check
