# איסוף חדשות כל ~30 דקות ופרסום site/ (כולל data/latest.json) ל-GitHub Pages
name: collect

on:
  schedule:
    - cron: "7,37 * * * *" # לא בדיוק ב-:00/:30, שם התור של GitHub עמוס
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["collector/**", "sources.json", "site/**", ".github/workflows/collect.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: collector/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run collect
        env:
          # הידיעות מהריצה הקודמת, כדי לשמור 48 שעות גם כשהפיד מחזיק מעט ידיעות
          PREVIOUS_LATEST_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/latest.json
          COLLECTOR_CONTACT_URL: ${{ github.server_url }}/${{ github.repository }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
